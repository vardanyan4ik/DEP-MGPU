x-airflow: &airflow
  build: .
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW_CONN_ANALYTICS_POSTGRES: postgresql://analytics:analytics@analytics_postgres:5432/analytics
    AIRFLOW__WEBSERVER__SECRET_KEY_CMD: cat /run/lab/airflow_key
    AIRFLOW__CORE__TEST_CONNECTION: Enabled
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - pipeline_data:/opt/airflow/dags/data
    - lab_keys:/run/lab:ro
  depends_on:
    environment-init:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    analytics_postgres:
      condition: service_healthy
services:
  environment-init:
    build: .
    user: '0:0'
    entrypoint: ['python', '/bootstrap_environment.py']
    environment:
      AIRFLOW_SECRET_KEY: ${AIRFLOW_SECRET_KEY:-}
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-}
    volumes:
      - lab_keys:/run/lab
      - pipeline_data:/data
  postgres:
    image: postgres:12.22
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - metadata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U airflow']
      interval: 5s
      retries: 20
  analytics_postgres:
    image: postgres:12.22
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: analytics
    volumes:
      - analytics:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U analytics']
      interval: 5s
      retries: 20
  airflow-init:
    <<: *airflow
    command: >-
      bash -c 'airflow db migrate && python /initialize_airflow.py &&
      (airflow users list | grep -q admin || airflow users create --username admin --password admin --firstname Lab --lastname Student --role Admin --email admin@example.com)'
  webserver:
    <<: *airflow
    command: webserver
    ports: ['8080:8080']
    depends_on:
      airflow-init:
        condition: service_completed_successfully
  scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
  redis:
    image: redis:7.4.2-alpine
  superset-init:
    build: ./superset
    environment: &superset-env
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    volumes: &superset-volumes
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./superset:/app/lab
      - lab_keys:/run/lab:ro
    command: >-
      bash -c 'superset db upgrade &&
      (superset fab list-users | grep -q admin || superset fab create-admin --username admin --password admin --firstname Lab --lastname Student --email admin@example.com) && superset init'
    depends_on:
      environment-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
  superset:
    build: ./superset
    environment: *superset-env
    volumes: *superset-volumes
    command: ['gunicorn', '--bind', '0.0.0.0:8088', '--workers', '2', '--timeout', '120', 'superset.app:create_app()']
    ports: ['8088:8088']
    depends_on:
      superset-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
  pgadmin:
    image: dpage/pgadmin4:9.1
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports: ['5050:80']
    volumes:
      - pgadmin:/var/lib/pgadmin
volumes:
  metadata:
  analytics:
  pgadmin:
  lab_keys:
  pipeline_data:
